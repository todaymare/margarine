[package]
name = "margarine"
version = "0.1.0"
edition = "2021"

[features]
fuzzer = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lexer = { path = "./lexer" }
parser = { path = "./parser" }
semantic_analysis = { path = "./semantic_analysis" }
llvm-api = { path = "./llvm-api" }
common = { path = "./common" }
errors = { path = "./errors" }

sti = { path = "vendor/sti" }

colourful = { git = "https://github.com/rookieCookies/colourful" }

rand = "*"
git2 = "0.20.2"
reqwest = { version = "0.12", features = ["blocking"] }
tempfile = "3"
hex = "*"

tracing = "*"

libc = "0.2"
sha2 = "0.10"


clap = { version = "4", features = ["derive"] }

fs2 = "0.4"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
flate2 = "1"
indicatif = "0.17"

[dev-dependencies]
parking_lot = "0.12"
