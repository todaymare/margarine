[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[lib]
name = "margarine_rt"
crate-type = ["staticlib"]

[features]
default = []
sanitizer = []

[dependencies]
common = { path = "../margarine/common" }
itoa = "*"
ryu = "*"
rand = "0.10"
getrandom = { version = "0.4", features = ["wasm_js"] }
